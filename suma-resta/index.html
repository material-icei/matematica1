<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sumas y restas hasta 99 - 1° grado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Cabecera: título, cambio de modo y álbum -->
  <header class="cabecera">
    <h1 id="titulo">🔢 Sumas y restas</h1>

    <div class="selector-modo" role="group" aria-label="Elegir sumas o restas">
      <button class="btn-modo" data-modo="suma">➕ Sumas</button>
      <button class="btn-modo" data-modo="resta">➖ Restas</button>
    </div>

    <button id="btn-album" class="btn-album">📒 Mis stickers <span id="contador-stickers">0/20</span></button>
  </header>

  <!-- Camino del personaje (progreso) -->
  <section class="camino-caja">
    <span id="contador" class="contador">Ejercicio 1 de 10</span>
    <div class="camino">
      <div class="camino-pista"></div>
      <div class="camino-relleno" id="camino-relleno"></div>
      <div id="estaciones"></div>
      <div class="meta" id="meta">🥕</div>
      <div class="mascota" id="mascota">🐰</div>
    </div>
  </section>

  <main id="juego">

    <section class="enunciado">
      <div class="emoji-personaje" id="emoji-personaje">🔢</div>
      <p id="texto-problema">Elegí si querés practicar sumas o restas.</p>
    </section>

    <section class="esquema-seccion">
      <div class="diagrama-wrapper">
        <div class="diagrama" id="diagrama">
          <!-- Los casilleros y flechas se generan con JavaScript -->
        </div>
      </div>
    </section>

    <section class="respuesta-seccion">
      <button id="btn-verificar">Verificar ✅</button>
    </section>

    <p id="feedback" class="feedback"></p>

  </main>
</div>

<!-- Pantalla de inicio: elegir sumas o restas -->
<div id="pantalla-inicio" class="overlay">
  <div class="tarjeta-overlay">
    <h2>¿Qué querés practicar hoy?</h2>
    <p class="aclaracion">Podés cambiar cuando quieras con los botones de arriba.</p>
    <div class="opciones-inicio">
      <button class="opcion-inicio suma" data-modo="suma">
        <span class="opcion-emoji">➕</span>
        <span>Sumas</span>
        <small>Ayudá al conejo 🐰 a llegar a la zanahoria 🥕</small>
      </button>
      <button class="opcion-inicio resta" data-modo="resta">
        <span class="opcion-emoji">➖</span>
        <span>Restas</span>
        <small>Ayudá al oso 🐻 a llegar a la miel 🍯</small>
      </button>
    </div>
  </div>
</div>

<!-- Aviso de sticker ganado -->
<div id="sticker-ganado" class="sticker-ganado oculto" aria-live="polite">
  <div class="sticker-grande" id="sticker-grande">⭐</div>
  <p id="texto-sticker">¡Ganaste un sticker!</p>
</div>

<!-- Álbum de stickers -->
<div id="pantalla-album" class="overlay oculto">
  <div class="tarjeta-overlay album">
    <h2>📒 Mi álbum de stickers</h2>
    <h3>➕ Sumas</h3>
    <div class="grilla-stickers" id="album-suma"></div>
    <h3>➖ Restas</h3>
    <div class="grilla-stickers" id="album-resta"></div>
    <p class="aclaracion" id="texto-album"></p>
    <button id="btn-cerrar-album" class="btn-redondo">Seguir jugando ▶️</button>
  </div>
</div>

<!-- Pantalla final de cada modo -->
<div id="pantalla-final" class="overlay oculto">
  <div class="tarjeta-overlay">
    <div class="trofeo" id="trofeo">🏆</div>
    <h2 id="titulo-final">¡Felicitaciones!</h2>
    <p id="texto-final"></p>
    <p class="final-stickers" id="final-stickers"></p>
    <p class="album-completo oculto" id="album-completo">🌟 ¡Completaste todo el álbum! 🌟</p>
    <div class="botones-final">
      <button id="btn-otro-modo" class="btn-redondo verde">Practicar restas ➖</button>
      <button id="btn-reiniciar" class="btn-redondo">Jugar de nuevo 🔄</button>
      <button id="btn-ver-album" class="btn-redondo secundario">Ver mi álbum 📒</button>
    </div>
  </div>
</div>

<div id="confetti-container" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
